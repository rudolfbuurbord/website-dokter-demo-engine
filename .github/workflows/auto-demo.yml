name: Auto demo (funnel)

# Bouwt automatisch demo's voor nieuwe funnel-leads met een website.
# Start: direct via Supabase (repository_dispatch), elke 10 min als vangnet (cron), of handmatig.
on:
  repository_dispatch:
    types: [auto-demo]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      website:
        description: 'Testsite (leeg = wachtrij uit Supabase verwerken)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: auto-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://skdjbifmtleiogbkqwid.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEMO_WORK: /tmp/demos
    steps:
      - name: Snel kijken of er werk is
        id: peek
        if: github.event_name == 'schedule'
        run: |
          n=$(curl -s "$SUPABASE_URL/rest/v1/dwd_funnel_leads?select=id&demo_status=in.(queued,building)&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" | grep -c '"id"' || true)
          echo "work=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.peek.outputs.work != '0'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.peek.outputs.work != '0'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Playwright-cache
        if: github.event_name != 'schedule' || steps.peek.outputs.work != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1

      - name: Installeren
        if: github.event_name != 'schedule' || steps.peek.outputs.work != '0'
        run: |
          pip install -q -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: Controle geheime sleutels
        if: github.event_name != 'schedule' || steps.peek.outputs.work != '0'
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY ontbreekt in de repo-secrets"; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY ontbreekt"; exit 1; }

      - name: Demo's bouwen
        id: claim
        if: github.event_name != 'schedule' || steps.peek.outputs.work != '0'
        run: python3 pipeline/queue_worker.py claim ${{ inputs.website != '' && format('--site {0}', inputs.website) || '' }}

      - name: Opslaan in de repo
        if: steps.claim.outputs.built != '' && steps.claim.outputs.built != '0'
        run: |
          git config user.name "De Website Dokters (auto-demo)"
          git config user.email "noreply@anthropic.com"
          git add public src/static-demos.js
          git commit -q -m "Auto-demo: $(python3 -c "import json;print(', '.join(r['result']['slug'] for r in json.load(open('/tmp/demo_results.json')) if r['result']))")"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - uses: actions/setup-node@v4
        if: steps.claim.outputs.built != '' && steps.claim.outputs.built != '0'
        with:
          node-version: 22

      - name: Online zetten (Cloudflare)
        id: deploy
        if: steps.claim.outputs.built != '' && steps.claim.outputs.built != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.130.0 deploy

      - name: Leads bijwerken (klaar)
        if: steps.claim.outputs.any != '' && steps.claim.outputs.any != '0' && (steps.deploy.outcome == 'success' || steps.claim.outputs.built == '0')
        run: python3 pipeline/queue_worker.py finish ok

      - name: Leads bijwerken (mislukt)
        if: failure() && steps.claim.outputs.any != '' && steps.claim.outputs.any != '0'
        run: python3 pipeline/queue_worker.py finish fail

      - name: Live controleren
        if: steps.deploy.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          for r in json.load(open('/tmp/demo_results.json')):
              if not r['result']: continue
              u = r['result']['url'] + '/'
              for _ in range(10):
                  try:
                      if 'De Website Dokters' in urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (DWD check)'}), timeout=15).read().decode('utf8', 'ignore'):
                          print('LIVE', u); break
                  except Exception: pass
                  time.sleep(5)
              else:
                  print('::warning::niet live:', u)
          PY
