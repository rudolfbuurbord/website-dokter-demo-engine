name: Lead Engine Tests
on:
  push:
    paths: ['lead-engine/**', '.github/workflows/lead-engine-tests.yml']
  pull_request:
    paths: ['lead-engine/**', '.github/workflows/lead-engine-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test lead-engine/tests/engine.test.mjs
