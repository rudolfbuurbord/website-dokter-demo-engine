<!doctype html><meta charset="utf-8"><title>Paint interaction review</title><style>body{font:14px system-ui;background:#ddd;margin:12px}nav{margin-bottom:12px}select,button{padding:8px}iframe{border:0}pre{position:fixed;left:850px;top:60px;font-size:12px;white-space:pre-wrap}</style><nav><label>Viewport <select id="size"><option>390x844</option><option>375x667</option><option>320x568</option><option>768x1024</option><option>1440x1000</option></select></label> <button id="check">Controleer</button></nav><iframe title="Hero preview" src="/"></iframe><pre id="result"></pre><script>
const f=document.querySelector('iframe'),s=document.querySelector('#size');function resize(){const[w,h]=s.value.split('x');f.width=w;f.height=h;}resize();s.onchange=resize;document.querySelector('#check').onclick=()=>{const d=f.contentDocument,w=f.contentWindow,h=d.querySelector('.hero'),hr=h.getBoundingClientRect();document.querySelector('#result').textContent=JSON.stringify({viewport:s.value,renderer:h.dataset.renderer,input:h.dataset.input,x:h.dataset.x,y:h.dataset.y,overflow:d.documentElement.scrollWidth>w.innerWidth,clipped:[...d.querySelectorAll('header,h1,.hero-bottom,.hint')].filter(e=>{const r=e.getBoundingClientRect();return r.left<0||r.right>w.innerWidth+1||r.bottom>hr.bottom}).map(e=>e.className||e.tagName),loaded:d.querySelector('#fallback').complete&&d.querySelector('#fallback').naturalWidth>0},null,2);};
</script>
