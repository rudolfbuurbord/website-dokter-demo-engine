<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Kleur & Karakter · formaatcontrole</title><style>body{margin:16px;font:13px system-ui;background:#deddd8}nav{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}button,select{padding:10px}iframe{flex:none;border:0;background:#f3efe5;display:block}pre{white-space:pre-wrap;max-width:600px}main{display:flex;gap:20px;align-items:flex-start}</style><nav><label>Schermformaat <select id="size"><option>390x844</option><option>375x667</option><option>320x568</option><option>768x1024</option><option>1440x1000</option><option>844x390</option></select></label><label>Sectie <select id="section"><option value="top">Hero</option><option value="transition">Verftransitie</option><option value="reviews">Reviews</option><option value="diensten">Diensten</option><option value="voor-na">Voor en na</option><option value="contact">Contact</option></select></label><button id="check">Controleer layout</button><button id="restart">Herstart opening</button></nav><main><iframe title="Demo op gekozen schermformaat" src="/kleur-karakter/"></iframe><pre id="result">Kies formaat en sectie.</pre></main><script>
const frame=document.querySelector('iframe'),size=document.querySelector('#size'),section=document.querySelector('#section');function resize(){const [w,h]=size.value.split('x');frame.width=w;frame.height=h}resize();size.onchange=resize;section.onchange=()=>{const d=frame.contentDocument,w=frame.contentWindow,key=section.value;w.scrollTo({top:key==='top'?0:key==='transition'?d.querySelector('.hero').offsetHeight*.60:d.getElementById(key).getBoundingClientRect().top+w.scrollY-20,behavior:'instant'})};document.querySelector('#restart').onclick=()=>frame.contentWindow.location.reload();document.querySelector('#check').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,v=d.querySelector('video'),hero=d.querySelector('.hero').getBoundingClientRect();document.querySelector('#result').textContent=JSON.stringify({version:d.body.dataset.version,viewport:[w.innerWidth,w.innerHeight],overflow:d.documentElement.scrollWidth>w.innerWidth+1,heroHeight:hero.height,cta:d.querySelector('.round-cta').getBoundingClientRect().bottom,video:{ready:v.readyState,paused:v.paused,time:v.currentTime},canvasReady:d.querySelector('.hero-journey').classList.contains('paint-ready'),sections:[...d.querySelectorAll('main section')].map(e=>e.id||'hero'),brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),activeService:d.querySelector('.service-swatch.active h3').textContent,console:'Controleer apart'},null,2)};
</script></html>
