<!doctype html><html lang="nl"><meta charset="utf-8"><title>Oors visual QA</title><style>body{font:13px Arial;margin:0;background:#d8d8d8}nav{height:60px;display:flex;align-items:center;gap:15px;padding:0 18px;background:white}button,select{padding:8px}#holder{margin:12px auto;position:relative}iframe{border:0;display:block;transform-origin:top left;background:white}output{font-size:12px}#checks{white-space:pre-wrap;background:white;margin:12px;padding:12px}</style><nav><label>Viewport <select id="size"><option>390x844</option><option>1440x1000</option><option>1280x900</option><option>768x1024</option><option>375x667</option></select></label><label>Scène <select id="scene"></select></label><button id="audit">Controleer alle scènes</button><output id="status">Laden</output></nav><div id="holder"><iframe title="Oors demo" src="./index.html"></iframe></div><pre id="checks"></pre><script>const frame=document.querySelector('iframe'),size=document.querySelector('#size'),scene=document.querySelector('#scene'),status=document.querySelector('#status');for(let i=0;i<13;i++)scene.add(new Option(String(i+1),String(i)));function fit(){const [w,h]=size.value.split('x').map(Number),scale=Math.min(1,(innerWidth-30)/w,(innerHeight-85)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';document.querySelector('#holder').style.width=w*scale+'px';document.querySelector('#holder').style.height=h*scale+'px';}function go(){const win=frame.contentWindow;const unit=Math.max(420,win.document.documentElement.clientHeight*1.25);win.document.querySelector('#experience').scrollTop=Number(scene.value)*unit;}function check(){const d=frame.contentDocument,h=frame.clientHeight,w=frame.clientWidth;const s=d.querySelector('.scene:not([inert])');if(!s)return ['Missing active scene'];return [...s.querySelectorAll('h1,h2,h3,p,a,blockquote,small,.project-image,.compare-picture,.ball-wrap')].filter(e=>getComputedStyle(e).display!=='none').flatMap(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&(r.left<-.5||r.right>w+.5||r.top<70||r.bottom>h-20)?[{text:(e.innerText||e.className).slice(0,55),rect:{x:r.x,y:r.y,w:r.width,h:r.height}}]:[];});}size.onchange=()=>{fit();setTimeout(go,100)};scene.onchange=()=>{go();setTimeout(()=>status.textContent=JSON.stringify(check()),100)};frame.onload=()=>{fit();status.textContent='Gereed'};document.querySelector('#audit').onclick=async()=>{const result=[];for(let i=0;i<13;i++){scene.value=i;go();await new Promise(r=>setTimeout(r,120));result.push({scene:i+1,issues:check()});}document.querySelector('#checks').textContent=JSON.stringify({viewport:size.value,result},null,2);status.textContent='Controle voltooid';};fit();</script></html>
