<!doctype html><meta charset="utf-8"><title>K&K responsive review</title><style>body{font:14px system-ui;background:#ddd;margin:12px}nav{display:flex;gap:15px;margin-bottom:12px}iframe{border:0;background:white}pre{white-space:pre-wrap;position:fixed;left:850px;top:50px;max-width:460px;max-height:85vh;overflow:auto;font-size:11px}button,select{padding:8px}</style><nav><label>Viewport <select id="size"><option>390x844</option><option>375x667</option><option>320x568</option><option>768x1024</option><option>1280x900</option><option>1440x1000</option><option>844x390</option></select></label><label>Scène <select id="scene"></select></label><button id="check">Controleer alle secties</button></nav><pre id="checks">Laden</pre><iframe title="Demo" src="/"></iframe><script>
const frame=document.querySelector('iframe'),size=document.querySelector('#size'),select=document.querySelector('#scene'),checks=document.querySelector('#checks');['Hero','Diensten','Project 1','Project 2','Project 3','Houtwerk','Details','Binnenwerk','Verhaal','Reviews','Contact','Footer'].forEach((s,i)=>select.add(new Option(s,i)));function resize(){let[w,h]=size.value.split('x');frame.width=w;frame.height=h;}resize();size.onchange=()=>{resize();checks.textContent='Viewport aangepast';};for(let i=0;i<11;i++)select.add(new Option('Overgang '+(i+1),i+.8));select.onchange=()=>{let w=frame.contentWindow;w.scrollTo(0,+select.value*w.document.querySelector('#stage').clientHeight*1.2);};async function tick(){await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}document.querySelector('#check').onclick=async()=>{checks.textContent='Bezig met controleren…';document.querySelector('#check').disabled=true;let w=frame.contentWindow,d=w.document,issues=[],results=[];await d.fonts.ready;let motion=d.body.classList.contains('motion');for(let i=0;i<12;i++){if(motion){w.scrollTo(0,i*d.querySelector('#stage').clientHeight*1.2);for(let k=0;k<40;k++){await new Promise(r=>setTimeout(r,50));if(Math.abs(Number(d.querySelector('#stage').dataset.beat)-i)<.04)break;}if(Math.abs(Number(d.querySelector('#stage').dataset.beat)-i)>.04)issues.push({beat:i,reason:'Scroll did not settle'});}const scene=motion?d.querySelector('.scene.active'):d.querySelectorAll('.scene')[Math.min(i,7)],r=scene.getBoundingClientRect();let bad=[];scene.querySelectorAll('h1,h2,h3,p,small,.button,svg,.compare-media,.story-image').forEach(el=>{if(el.closest('.project')||el.closest('#paint'))return;let b=el.getBoundingClientRect();if(b.width&&b.height&&(b.left<r.left-1||b.right>r.right+1||b.top<r.top-1||b.bottom>r.bottom+1))bad.push(el.id||el.className||el.tagName);});if(bad.length)issues.push({scene:scene.id,outside:bad});results.push(scene.id);}let images=[...d.images].filter(im=>!im.complete||!im.naturalWidth).map(im=>im.src);checks.textContent=JSON.stringify({viewport:size.value,motion,overflow:d.documentElement.scrollWidth>w.innerWidth,issues,images,scenes:[...new Set(results)]},null,2);document.querySelector('#check').disabled=false;select.value='0';w.scrollTo(0,0);};frame.onload=()=>checks.textContent='Klaar voor controle';
</script>
